server {
    listen 80;
    server_name api.feelriyadh.com;

    client_max_body_size 50M;

    location /static/ {
        alias /home/feelriyadh-api/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /home/feelriyadh-api/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://unix:/run/feelriyadh-api/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
